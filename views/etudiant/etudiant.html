<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Étudiants</title>

    <link rel="stylesheet" href="/views/css/etudiant.css">
        
</head>
<body>
   <div style="display: flex;"> <!-- Navbar copié depuis navbar.html -->
   <nav class="sidebar">
        <div class="sidebar-bg-anim" id="sidebar-bg-anim"></div>
        <div class="sidebar-header">
            <h2>Transport Scolaire</h2>
        </div>
        <a href="/index.html" class="active">Dashboard</a>
        <a href="/views/transports/transport.html">Transport</a>
        <a href="/views/etudiant/etudiant.html">Étudiant</a>
        <a href="/views/bus/bus.html">Bus</a>
    </nav>
    <div style="display: block;">
        <div class="form-etudiant">
        <h2 class="form-title">Ajouter un Étudiant</h2>
        <form id="studentForm" class="student-form" method="POST">
    <div class="form-group">
        <label for="id_eleve" class="form-label">ID Étudiant:</label>
        <input type="text" id="id_eleve" name="id_eleve" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="nom" class="form-label">Nom:</label>
        <input type="text" id="nom" name="nom" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="prenom" class="form-label">Prénom:</label>
        <input type="text" id="prenom" name="prenom" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="date_naissance" class="form-label">Date de Naissance:</label>
        <input type="date" id="date_naissance" name="date_naissance" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="classe" class="form-label">Classe:</label>
        <input type="text" id="classe" name="classe" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="adresse" class="form-label">Adresse:</label>
        <input type="text" id="adresse" name="adresse" class="form-input" required>
    </div>
    <div class="form-group">
        <label for="tel_parent" class="form-label">Téléphone des Parents:</label>
        <input type="text" id="tel_parent" name="tel_parent" class="form-input" required>
    </div>
    <div class="form-actions">
        <button type="submit" class="form-button">Enregistrer</button>
        <button type="button" id="updateStudentBtn" class="form-button" style="display:none;">Modifier</button>
    </div>
</form>
        </div>


        <div class="table-toolbar"><input id="studentSearch" type="text" placeholder="Rechercher..." /><span class="query-display" id="studentQuery"></span></div>
        <table class="student-table" data-entity="etudiant">
    <thead>
        <tr>
            <th class="table-header">ID</th>
            <th class="table-header">Nom</th>
            <th class="table-header">Prénom</th>
            <th class="table-header">Date de Naissance</th>
            <th class="table-header">Classe</th>
            <th class="table-header">Adresse</th>
            <th class="table-header">Téléphone des Parents</th>
            <th class="table-header">Action</th> <!-- Nouvelle colonne pour les actions -->
        </tr>
    </thead>
    <tbody id="studentTable" class="table-body">
        <tr>
            <td class="table-cell">{{ id_Eleve }}</td>
            <td class="table-cell">{{ nomE }}</td>
            <td class="table-cell">{{ prenomE }}</td>
            <td class="table-cell">{{ dateN }}</td>
            <td class="table-cell">{{ classe }}</td>
            <td class="table-cell">{{ adresse }}</td>
            <td class="table-cell">{{ telParent }}</td>
            <td class="table-cell">
                <a class="delete-button row-delete" href="/views/etudiant/delete?id_eleve={{ id_Eleve }}">Supprimer</a>
            </td>
        </tr>
        <!-- Ajoutez d'autres lignes ici -->
    </tbody>
</table>
        <div class="pagination-container centered" data-target="studentTable">
            <button class="pagination-button prev" disabled>Précédent</button>
            <span class="pageInfo"></span>
            <button class="pagination-button next">Suivant</button>
        </div>
        </div>
 </div>  
 <script src="/views/js/script.js"></script>
 </body>
 </html>
