<script>
// Générer dynamiquement plusieurs carrés qui défilent 5 par 5
const sidebarAnim = document.getElementById('sidebar-bg-anim');
if (sidebarAnim) {
    const squareCount = 25; // Total de carrés
    const columns = 5; // 5 carrés visibles par "colonne"
    const sidebarWidth = 250;
    const squareSize = 32;
    const colSpacing = (sidebarWidth - columns * squareSize) / (columns + 1);
    for (let i = 0; i < squareCount; i++) {
        const col = i % columns;
        const delay = (i % columns) * 1.2 + Math.floor(i / columns) * 0.7;
        const left = colSpacing + col * (squareSize + colSpacing);
        const div = document.createElement('div');
        div.className = 'square';
        div.style.left = left + 'px';
        div.style.animationDelay = delay + 's';
        sidebarAnim.appendChild(div);
    }
}
</script>
